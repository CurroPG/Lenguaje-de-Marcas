<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Curro Portillo Guerrero">
    <title>Localizaciones - Studio Ghibli</title>
    <link rel="stylesheet" href="./estilos.css">
</head>
<body>

    <header>
        <h1>Studio Ghibli</h1>
        <img src="./img/studio-ghibli_3du4.jpg" alt="logo Studio Ghibli">
        <nav>
            <a href="./index.html">Inicio</a>
            <a href="./localizaciones.html" class="activo">Localizaciones</a>
            <a href="./sobreMi.html">Sobre mí</a>
        </nav>
    </header>

    <main>

    <section id="seccion-locations">
        <h2>Localizaciones</h2>
        <button id="btnLocations">Cargar localizaciones</button>
        <label for="filtroTerreno">Filtrar por terreno:</label>
        <select id="filtroTerreno">
            <option value="">Todos los terrenos</option>
            <option value="mountain">Mountain</option>
            <option value="hill">Hill</option>
            <option value="plain">Plain</option>
            <option value="marsh">Marsh</option>
            <option value="forest">Forest</option>
            <option value="city">City</option>
            <option value="river">River</option>
            <option value="ocean">Ocean</option>
        </select>
        <div id="contLocations"></div>
    </section>

    

    <section id="seccion-species">
        <h2>Especies</h2>
        <button id="btnSpecies">Cargar especies</button>
        <div id="contSpecies"></div>
    </section>
    
    <script src="./js/javascript2.js"></script>

</main>
</body>
</html>
