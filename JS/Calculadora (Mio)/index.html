<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="shortcut icon" href="./imagenes/calculator-icon-windows-v1.ico" type="image/x-icon">
</head>

<body>

    <header>
        <h1 class="titulo">Calculadora</h1>
    </header>

    <main>
        <div class="contenido-calculadora">
            <div class="pantalla">0</div>
            <div class="botones">

                <button class="retroceso" id="borrar-pantalla">CE</button>
                <button class="retroceso" id="borrar-todo">C</button>
                <button class="retroceso" id="retroceder">⌫</button>

                <button class="inmediatas" id="uno-partido"></button>
                <button class="inmediatas" id="cuadrado"></button>
                <button class="inmediatas" id="raiz"></button>
                <button class="operadores" id="dividir">/</button>

                <button class="numeros">9</button>
                <button class="numeros">8</button>
                <button class="numeros">7</button>
                <button class="operadores" id="multiplicar">*</button>

                <button class="numeros">6</button>
                <button class="numeros">5</button>
                <button class="numeros">4</button>
                <button class="operadores" id="restar">-</button>

                <button class="numeros">3</button>
                <button class="numeros">2</button>
                <button class="numeros">1</button>
                <button class="operadores" id="sumar">+</button>

                <button class="numeros">0</button>
                <button class="punto">.</button>
                <button class="igual">=</button>
                
            </div>
        </div>

    </main>

    <footer class="pie">

    </footer>
    <script src="./js/javascript.js"></script>
</body>

</html>
